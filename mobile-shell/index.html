<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071b2d" />
    <title>Athlentra Tennis</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3f6f2; color: #071b2d; }
      main { max-width: 28rem; margin: 1.5rem; padding: 2.25rem; text-align: center; border: 1px solid #dce5df; border-radius: 1.75rem; background: white; box-shadow: 0 18px 45px rgba(7, 27, 45, .08); }
      .mark { width: 4rem; height: 4rem; margin: 0 auto 1.5rem; display: grid; place-items: center; border-radius: 1.25rem; background: #071b2d; color: #d8ff52; font-size: 1.6rem; font-weight: 800; }
      h1 { margin: 0; font-size: 1.8rem; letter-spacing: -.03em; }
      p { color: #475569; line-height: 1.65; }
      a { display: inline-flex; min-height: 3rem; margin-top: .5rem; align-items: center; justify-content: center; border-radius: .8rem; background: #071b2d; padding: 0 1.25rem; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1>Athlentra Tennis</h1>
      <p>This file is part of the native app package, not the browser preview. Use the local web app while the signed iPhone and Android builds are being prepared.</p>
      <a href="http://127.0.0.1:3000">Open local preview</a>
    </main>
  </body>
</html>
